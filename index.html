<!DOCTYPE html>
<html lang="es" data-lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Finca El Curio — Escazú, Costa Rica</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* CSS COMPLETO - sin cambios */
:root{
  --vd:#0d3b1e; --vm:#1f5b32; --va:#8ea84a; --vc:#a8c45a;
  --cr:#f5f0e0; --crd:#ede4cc; --tx:#1a2e1c;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Crimson Pro',Georgia,serif;background:var(--cr);color:var(--tx);}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--crd);}
::-webkit-scrollbar-thumb{background:var(--va);border-radius:3px;}
header{background:linear-gradient(135deg,var(--vd) 0%,#0f4a24 50%,var(--vm) 100%);padding:0 48px;height:88px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000;border-bottom:2px solid rgba(168,196,90,.22);box-shadow:0 4px 30px rgba(0,0,0,.4);}
.logo-wrap{display:flex;align-items:center;gap:13px;text-decoration:none;}
.logo-wrap img{width:66px;height:66px;border-radius:50%;border:2.5px solid var(--va);object-fit:cover;box-shadow:0 0 18px rgba(142,168,74,.35);}
.logo-text .finca{color:rgba(255,255,255,.65);font-size:10px;letter-spacing:4px;text-transform:uppercase;font-family:'Crimson Pro',serif;}
.logo-text .nombre{color:var(--vc);font-family:'Cinzel',serif;font-size:19px;font-weight:700;letter-spacing:1px;line-height:1.1;}
nav a{color:rgba(255,255,255,.8);text-decoration:none;padding:8px 12px;font-size:13px;font-family:'Crimson Pro',serif;font-weight:600;letter-spacing:.5px;border-radius:6px;transition:color .25s;position:relative;}
nav a::after{content:'';position:absolute;bottom:4px;left:12px;right:12px;height:1px;background:var(--va);transform:scaleX(0);transition:transform .25s;}
nav a:hover{color:white;}
nav a:hover::after{transform:scaleX(1);}
.header-right{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.lang-btn-wrap{display:flex;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(168,196,90,.3);border-radius:20px;overflow:hidden;}
.lang-btn-wrap span{padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:1.5px;color:rgba(255,255,255,.5);transition:all .2s;font-family:'Cinzel',serif;cursor:pointer;user-select:none;}
.lang-btn-wrap span.active{background:var(--va);color:white;border-radius:18px;}
.btn{background:var(--va);color:white;padding:10px 20px;border:none;border-radius:8px;text-decoration:none;font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .25s;display:inline-block;}
.btn:hover{background:var(--vc);transform:translateY(-2px);box-shadow:0 6px 20px rgba(142,168,74,.4);}
.btn-sm{padding:7px 14px;font-size:11px;letter-spacing:.5px;}
.btn-danger{background:#c0392b!important;}
.btn-wa{background:#25D366!important;}
.btn-mail{background:#3498db!important;}
.btn-purple{background:linear-gradient(135deg,#8e44ad,#9b59b6)!important;}
.btn-orange{background:#f39c12!important;}
.btn-teal{background:#1abc9c!important;}
.btn-outline-w{background:transparent;border:1.5px solid rgba(255,255,255,.6);color:white;}
.btn-outline-w:hover{background:rgba(255,255,255,.1);border-color:white;transform:none;}
.btn-reassign{background:#8e44ad!important;color:white;}
.badge-yellow{background:#f39c12;color:white;padding:3px 10px;border-radius:20px;font-size:11px;display:inline-block;}
.hero{position:relative;min-height:560px;display:flex;align-items:center;overflow:hidden;}
.hero-bg{position:absolute;inset:0;background:linear-gradient(135deg, #0a2a14, #1a4520);background-size:cover;background-position:center 30%;transform:scale(1.05);animation:hZoom 20s ease-in-out infinite alternate;}
@keyframes hZoom{from{transform:scale(1.05);}to{transform:scale(1.11);}}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(105deg,rgba(7,28,14,.84) 0%,rgba(13,59,30,.62) 45%,rgba(0,0,0,.22) 100%);}
.hero-grain{position:absolute;inset:0;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px;}
.hero-content{position:relative;z-index:2;padding:80px;max-width:680px;animation:fadeUp 1s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.hero-eyebrow{display:inline-flex;align-items:center;gap:10px;background:rgba(142,168,74,.17);border:1px solid rgba(142,168,74,.38);padding:6px 16px;border-radius:30px;color:var(--vc);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:22px;backdrop-filter:blur(6px);}
.hero-content h2{font-family:'Cinzel',serif;font-size:58px;font-weight:900;line-height:1.05;color:white;margin-bottom:20px;text-shadow:0 3px 20px rgba(0,0,0,.5);}
.hero-content h2 em{color:var(--vc);font-style:normal;display:block;}
.hero-content p{font-size:17px;line-height:1.75;color:rgba(255,255,255,.85);margin-bottom:30px;}
.hero-badges{display:flex;margin-bottom:32px;border:1px solid rgba(255,255,255,.13);border-radius:12px;overflow:hidden;backdrop-filter:blur(8px);width:fit-content;}
.hero-badge{padding:12px 20px;border-right:1px solid rgba(255,255,255,.1);color:white;font-size:13px;line-height:1.4;background:rgba(255,255,255,.05);display:flex;align-items:center;gap:10px;}
.hero-badge:last-child{border-right:none;}
.hero-badge .icon{font-size:20px;}
.hero-badge strong{display:block;font-size:14px;color:var(--vc);}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;}
.hero-location{position:absolute;right:56px;bottom:42px;z-index:2;background:rgba(7,28,14,.88);border:1px solid rgba(142,168,74,.3);padding:16px 22px;border-radius:16px;color:white;font-size:13px;line-height:1.6;backdrop-filter:blur(12px);}
.hero-location .pin{display:flex;align-items:center;gap:8px;color:var(--vc);font-weight:600;margin-bottom:4px;}
.hero-location .coords{color:rgba(255,255,255,.45);font-size:11px;letter-spacing:1px;}
.cap-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(142,168,74,.2);border:1px solid rgba(142,168,74,.4);padding:6px 16px;border-radius:30px;color:var(--vc);font-size:13px;margin-top:12px;}
.cap-badge.lleno{background:rgba(192,57,43,.3);border-color:rgba(192,57,43,.5);color:#ff8888;}
.divider{height:4px;background:linear-gradient(90deg,var(--vd),var(--va),var(--vd));}
.section{max-width:1200px;margin:0 auto;padding:76px 40px;}
.bg-dark{background:linear-gradient(180deg,#1a3520 0%,#0d2a16 100%);}
.bg-dark-2{background:#0d2a16;}
.section-title{text-align:center;margin-bottom:50px;}
.section-title .eyebrow{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--va);margin-bottom:12px;display:block;}
.section-title h2{font-family:'Cinzel',serif;font-size:38px;color:var(--vd);font-weight:700;}
.dark-title .eyebrow{color:var(--vc);}
.dark-title h2{color:white;}
.tours-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:28px;}
.tour-card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.09);transition:transform .35s cubic-bezier(.22,.68,0,1.2),box-shadow .35s;border:1px solid rgba(0,0,0,.05);cursor:pointer;}
.tour-card:hover{transform:translateY(-8px);box-shadow:0 24px 60px rgba(0,0,0,.15);}
.tour-img{position:relative;height:200px;overflow:hidden;background:#e8f0e0;}
.tour-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
.tour-card:hover .tour-img img{transform:scale(1.01);}
.tour-tag{position:absolute;top:14px;left:14px;background:var(--va);color:white;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;border-radius:20px;font-family:'Cinzel',serif;}
.tour-body{padding:24px 26px 28px;}
.tour-body h3{font-family:'Cinzel',serif;font-size:17px;color:var(--vd);margin-bottom:10px;line-height:1.3;}
.tour-body p{font-size:15px;color:#5a6e5a;line-height:1.65;margin-bottom:16px;}
.tour-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--va);font-weight:600;padding-top:14px;border-top:1px solid #eee;}
.form-wrap{max-width:780px;margin:0 auto;background:white;border-radius:24px;padding:46px 50px;box-shadow:0 20px 80px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.05);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.fg{margin-bottom:18px;}
.fg label{display:block;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--vd);margin-bottom:7px;font-family:'Cinzel',serif;}
.fg input,.fg select,.fg textarea{width:100%;padding:13px 16px;border:1.5px solid #ddd;border-radius:10px;font-family:'Crimson Pro',serif;font-size:15px;color:var(--tx);background:#fafaf8;transition:all .2s;outline:none;-webkit-appearance:none;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--va);background:white;box-shadow:0 0 0 3px rgba(142,168,74,.12);}
.btn-full{width:100%;padding:16px;font-size:13px;letter-spacing:2px;border-radius:12px;margin-top:6px;}
.pagos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.pago-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:34px 26px;text-align:center;transition:all .3s;backdrop-filter:blur(6px);}
.pago-card:hover{background:rgba(142,168,74,.12);border-color:rgba(142,168,74,.4);transform:translateY(-4px);}
.pago-icon{font-size:40px;margin-bottom:14px;display:block;}
.pago-card h3{font-family:'Cinzel',serif;color:white;font-size:17px;margin-bottom:8px;}
.pago-card p{color:rgba(255,255,255,.5);font-size:14px;}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.info-card{background:white;border-radius:18px;padding:30px;box-shadow:0 6px 30px rgba(0,0,0,.07);border-top:3px solid var(--va);transition:transform .3s;}
.info-card:hover{transform:translateY(-4px);}
.info-card .ic-icon{font-size:30px;margin-bottom:12px;display:block;}
.info-card h3{font-family:'Cinzel',serif;font-size:16px;color:var(--vd);margin-bottom:8px;}
.info-card p{font-size:15px;color:#5a6e5a;line-height:1.7;}
.padrino-wrap{max-width:800px;margin:0 auto;background:white;border-radius:24px;padding:46px 50px;box-shadow:0 20px 80px rgba(0,0,0,.12);}
.padrino-wrap h3{font-family:'Cinzel',serif;color:var(--vd);margin-bottom:12px;}
.opcion-aporte{background:#fafaf8;border-radius:14px;padding:16px 20px;margin:10px 0;cursor:pointer;transition:.2s;border:2px solid #e0d5c0;display:flex;align-items:center;justify-content:space-between;}
.opcion-aporte:hover{border-color:var(--va);}
.opcion-aporte.selected{border-color:#9b59b6;background:#f9f0ff;}
.opcion-aporte .chk{color:#9b59b6;font-weight:bold;display:none;}
.opcion-aporte.selected .chk{display:inline;}
.msg-agradecimiento{background:#d4edda;border-left:4px solid #28a745;padding:12px;border-radius:12px;font-size:14px;color:#155724;margin:14px 0;}
.datos-bancarios-box{background:#fff3cd;border-left:4px solid #ffc107;padding:14px;border-radius:12px;font-size:14px;margin:10px 0;display:none;}
.info-aporte-det{background:#e8f5e9;border-radius:12px;padding:12px;margin:12px 0;display:none;}
.planta-box{max-width:700px;margin:0 auto;background:white;border-radius:24px;padding:40px;box-shadow:0 12px 50px rgba(0,0,0,.1);}
.planta-badge{display:inline-flex;align-items:center;gap:8px;background:var(--vd);color:var(--vc);padding:8px 18px;border-radius:30px;font-family:'Cinzel',serif;font-size:14px;font-weight:700;}
.planta-badge.pendiente{background:#f39c12;color:white;}
.historial{background:#f8f2e3;border-radius:14px;padding:14px;margin-top:14px;max-height:220px;overflow-y:auto;}
.comentario-item{background:white;border-radius:10px;padding:10px;margin-bottom:8px;border-left:3px solid var(--va);}
.comentario-fecha{font-size:11px;color:#999;margin-bottom:4px;}
.galeria-imgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.img-item{position:relative;width:100px;height:100px;border-radius:10px;overflow:hidden;border:2px solid #ddd;}
.img-item img{width:100%;height:100%;object-fit:cover;}
.img-del{position:absolute;top:2px;right:2px;background:rgba(192,57,43,.85);color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:20px;text-align:center;}
.contact-strip{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;}
footer{background:linear-gradient(180deg,#061409 0%,#0a1f0e 100%);color:rgba(255,255,255,.7);padding:64px 40px 36px;border-top:1px solid rgba(142,168,74,.2);}
.footer-inner{max-width:900px;margin:0 auto;text-align:center;}
.footer-logo{font-family:'Cinzel',serif;font-size:30px;color:var(--vc);margin-bottom:6px;}
.footer-tagline{font-size:14px;color:rgba(255,255,255,.3);letter-spacing:3px;text-transform:uppercase;margin-bottom:34px;}
.footer-line{width:50px;height:2px;background:var(--va);margin:0 auto 34px;}
.footer-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:28px;margin-bottom:36px;text-align:left;}
.footer-col h4{font-family:'Cinzel',serif;font-size:11px;color:var(--vc);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;}
.footer-col p,.footer-col a{font-size:14px;color:rgba(255,255,255,.5);line-height:1.9;text-decoration:none;display:block;transition:color .2s;}
.footer-col a:hover{color:var(--vc);}
.footer-copy{font-size:12px;color:rgba(255,255,255,.22);padding-top:26px;border-top:1px solid rgba(255,255,255,.07);}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10000;justify-content:center;align-items:center;backdrop-filter:blur(5px);}
.mo.open{display:flex;}
.mc{background:white;width:90%;max-width:540px;border-radius:24px;padding:42px 44px;position:relative;border-top:6px solid var(--va);box-shadow:0 30px 80px rgba(0,0,0,.3);animation:mIn .3s cubic-bezier(.22,.68,0,1.2) both;max-height:90vh;overflow-y:auto;}
.mc.mc-wide{max-width:1020px;}
@keyframes mIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
.mc h2{font-family:'Cinzel',serif;font-size:22px;color:var(--vd);text-align:center;margin-bottom:26px;}
.mc h3{font-family:'Cinzel',serif;font-size:18px;color:var(--vd);margin-bottom:14px;}
.mc-close{position:absolute;top:16px;right:20px;background:none;border:none;font-size:24px;color:#aaa;cursor:pointer;line-height:1;}
.mc-close:hover{color:#333;}
.mc .fg{margin-bottom:16px;}
.mc .fg input,.mc .fg select,.mc .fg textarea{padding:12px 15px;border:1.5px solid #ddd;border-radius:10px;font-family:'Crimson Pro',serif;font-size:15px;width:100%;outline:none;transition:all .2s;background:#fafaf8;}
.mc .fg input:focus,.mc .fg select:focus{border-color:var(--va);background:white;}
.mc .fg label{display:block;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--vd);margin-bottom:7px;font-family:'Cinzel',serif;}
.admin-fixed{position:fixed;right:20px;bottom:20px;z-index:9999;width:54px;height:54px;background:linear-gradient(135deg,var(--vd),var(--vm));border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 25px rgba(0,0,0,.35);font-size:22px;color:white;border:2px solid rgba(142,168,74,.4);transition:all .25s;}
.admin-fixed:hover{background:var(--va);transform:scale(1.1) rotate(-10deg);}
.admin-nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;}
.admin-nav-btn{background:#f0f0f0;border:none;padding:9px 18px;border-radius:30px;cursor:pointer;font-size:13px;font-family:'Cinzel',serif;font-weight:600;transition:all .2s;color:var(--vd);}
.admin-nav-btn:hover,.admin-nav-btn.active{background:var(--va);color:white;}
.admin-section{display:none;}
.admin-section.visible{display:block;}
.filtros{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.filtro-btn{padding:7px 18px;border-radius:30px;border:none;cursor:pointer;background:#ecf0f1;font-size:13px;font-family:'Cinzel',serif;transition:all .2s;}
.filtro-btn.activo{background:var(--va);color:white;}
table.tb{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px;}
table.tb th{background:linear-gradient(135deg,var(--va),#7a9438);color:white;padding:11px 12px;text-align:left;font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;}
table.tb td{border:1px solid #e8e8e8;padding:10px 12px;vertical-align:middle;}
table.tb tr:hover{background:#fafaf8;}
.badge-green{background:#27ae60;color:white;padding:3px 10px;border-radius:20px;font-size:11px;display:inline-block;}
.badge-orange{background:#f39c12;color:white;padding:3px 10px;border-radius:20px;font-size:11px;display:inline-block;}
.check-visita{width:18px;height:18px;cursor:pointer;accent-color:#27ae60;}
.admin-card-stat{background:linear-gradient(135deg,var(--vd),var(--vm));color:white;border-radius:16px;padding:22px;text-align:center;}
.admin-card-stat .num{font-family:'Cinzel',serif;font-size:36px;font-weight:900;color:var(--vc);}
.admin-card-stat .lbl{font-size:13px;color:rgba(255,255,255,.6);margin-top:6px;}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:22px;}
.barra-g{margin:8px 0;}
.barra-g .bl{font-size:12px;color:#555;margin-bottom:4px;}
.barra-g .bf{background:#e8e8e8;border-radius:20px;height:20px;overflow:hidden;}
.barra-g .bll{background:var(--va);height:100%;border-radius:20px;display:flex;align-items:center;padding-left:8px;font-size:11px;color:white;font-weight:700;min-width:30px;}
.planta-admin-item{background:#fafaf8;border-radius:14px;padding:16px;margin-bottom:12px;border-left:3px solid var(--va);}
.planta-admin-item img{max-width:120px;border-radius:10px;margin-top:8px;}
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:900px){
  header{padding:12px 20px;height:auto;flex-wrap:wrap;gap:10px;}
  nav{display:none;}
  .hero-content{padding:56px 24px 110px;}
  .hero-content h2{font-size:36px;}
  .hero-location{right:16px;bottom:16px;}
  .hero-badges{flex-wrap:wrap;}
  .section{padding:52px 20px;}
  .form-wrap,.padrino-wrap,.planta-box{padding:28px 20px;}
  .form-row,.config-grid{grid-template-columns:1fr;}
  .pagos-grid,.info-grid{grid-template-columns:1fr;}
  .footer-info{grid-template-columns:1fr;text-align:center;}
  .mc{padding:28px 20px;}
  table.tb{font-size:11px;}
}
</style>
</head>
<body>

<!-- Todo tu HTML (header, hero, tours, modales, footer, etc.) se mantiene igual al que me enviaste -->

<header>
  <a href="#inicio" class="logo-wrap">
    <img id="logoImg" alt="Logo Finca El Curio" style="background:#2d5a30; display:flex; align-items:center; justify-content:center; font-size:28px; color:var(--vc);">
    <div class="logo-text">
      <span class="finca" data-es="Finca" data-en="Farm">Finca</span>
      <span class="nombre">El Curio</span>
    </div>
  </a>
  <nav id="navPublic">
    <a href="#inicio" data-es="Inicio" data-en="Home">Inicio</a>
    <a href="#tours" data-es="Tours" data-en="Tours">Tours</a>
    <a href="#reservas" data-es="Reservas" data-en="Book">Reservas</a>
    <a href="#contacto" data-es="Contacto" data-en="Contact">Contacto</a>
  </nav>
  <nav id="navPrivate" style="display:none;">
    <a href="#miPlanta" data-es="Mi Planta" data-en="My Plant">Mi Planta</a>
    <a href="#reservas" data-es="Reservas" data-en="Book">Reservas</a>
    <a href="#padrino" data-es="Ser Padrino" data-en="Godparent">Ser Padrino</a>
    <a href="#testimonios" data-es="Testimonios" data-en="Testimonials">Testimonios</a>
    <a href="#contacto" data-es="Contacto" data-en="Contact">Contacto</a>
    <a href="#" id="btnMiCuenta" data-es="👤 Cuenta" data-en="👤 Account" style="color:var(--vc)!important;">👤 Cuenta</a>
  </nav>
  <div class="header-right">
    <div class="lang-btn-wrap">
      <span id="lbEs" class="active" onclick="setLang('es')">ES</span>

function cargar(){
  const p=localStorage.getItem('fec_plantas');

  else { for(let f of FILAS) for(let n=1;n<=N_POR_FILA;n++) DB.plantas[f+n]={imagen:null,comentario:'',clienteEmail:null,fechaAsignacion:null,historialComentarios:[]}; }

  const pad=localStorage.getItem('fec_padrinos'); if(pad) DB.padrinos=JSON.parse(pad);
  const cfg=localStorage.getItem('fec_cfg');
  if(cfg){
    const savedCfg = JSON.parse(cfg);
    const defaultTours = CFG.tours;
    const defaultGrupos = CFG.grupos;
    CFG={...CFG,...savedCfg};
    if(!CFG.tours || !CFG.tours.length) CFG.tours = defaultTours;
    if(!CFG.grupos) CFG.grupos = defaultGrupos;
    if(!CFG.visibility) CFG.visibility = { hero:true, tours:true, reservas:true, pagos:true, info:true, testimonios:true, footer:true };
    if(!CFG.images) CFG.images = { logo:null, hero:null, padrino:null, admin:null, tourCompleto:null, tourCaña:null, tourSiembra:null };

  const bc=localStorage.getItem('fec_bancos'); if(bc) BANCOS=JSON.parse(bc);
  for(let e in DB.clientes){
    const c=DB.clientes[e];
    if(c.visita===undefined) c.visita=false;
    if(!c.telefono) c.telefono='';
    if(!c.imagenes) c.imagenes=[];
    if(!c.historialComentarios) c.historialComentarios=[];
  }
}

  if(isNaN(val) || val < 1){
    if(msg){ msg.textContent='⚠️ Ingresa un número válido mayor a 0.'; msg.style.cssText='display:block;padding:10px 14px;background:#fff3cd;border-left:4px solid #f39c12;border-radius:8px;color:#856404;font-size:14px;'; clearTimeout(msg._t); msg._t=setTimeout(()=>{msg.style.display='none';},3500); }
    return;

  if(val < ocupadas){
    if(msg){ msg.textContent='⛔ No puedes reducir la capacidad por debajo de las plantas ya asignadas ('+ocupadas+').'; msg.style.cssText='display:block;padding:10px 14px;background:#f8d7da;border-left:4px solid #c0392b;border-radius:8px;color:#721c24;font-size:14px;'; clearTimeout(msg._t); msg._t=setTimeout(()=>{msg.style.display='none';},5000); }
    return;
  }
  CFG.capPlantas = val;
  guardar();
  renderCap();
  renderTours();
  actualizarHorarios();
  const capInfoEl = document.getElementById('capInfo');
  if(capInfoEl){ const c=capInfo(); capInfoEl.innerHTML='<div class="cap-badge '+(c.disponibles===0?'lleno':'')+'">🌱 '+c.ocupadas+'/'+c.total+' · '+c.disponibles+' disponibles</div>'; }
  if(msg){ msg.textContent='✅ Capacidad actualizada a '+val+' plantas. Disponibles: '+(val-ocupadas)+'.'; msg.style.cssText='display:block;padding:10px 14px;background:#d4edda;border-left:4px solid #27ae60;border-radius:8px;color:#155724;font-size:14px;font-weight:600;'; clearTimeout(msg._t); msg._t=setTimeout(()=>{msg.style.display='none';},4000); }
  input.value = '';
}
function renderCap(){

// ═══════════════════════════════════════════
//  HORARIOS Y RESERVAS
// ═══════════════════════════════════════════
function generarHorarios(fecha) {
    const ahora = new Date();
    const esHoy = new Date(fecha + "T00:00:00").toDateString() === ahora.toDateString();
    let hor = 8, min = 0, lista = [];
    while (hor < 16) {
        const hs = `${String(hor).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
        let disp = true;
        if (esHoy) {
            if (hor < ahora.getHours() || (hor === ahora.getHours() && min <= ahora.getMinutes())) disp = false;
        }
        const ocup = DB.reservas.filter(rv => rv.fecha === fecha && rv.horario === hs).length;
        if (ocup >= CFG.capacidadHorario) disp = false;
        lista.push({ hora: hs, disponible: disp, cupos: CFG.capacidadHorario - ocup });
        min += 30;
        if (min >= 60) { hor += Math.floor(min / 60); min = min % 60; }
    }
    return lista;
}
function actualizarHorarios() {
    const f = document.getElementById('rFecha').value;
    const tSel = document.getElementById('rTour').value;
    const s = document.getElementById('rHora');
    const ic = document.getElementById('infoCupos');
    if (!f) {
        s.innerHTML = `<option>${lang === 'es' ? 'Selecciona fecha primero' : 'Select date first'}</option>`;
        return;
    }
    const tourData = window.currentTours ? window.currentTours.find(t => t.title === tSel) : null;
    const durTxt = tourData ? tourData.dur : "2-3 horas";
    const hs = generarHorarios(f);
    s.innerHTML = hs.map(h => 
        h.disponible 
        ? `<option value="${h.hora}">${h.hora} (${h.cupos} cupos)</option>` 
        : `<option disabled>${h.hora} ❌</option>`
    ).join('');
    ic.innerHTML = `📊 ${lang === 'es' ? 'Cupos' : 'Spots'}: ${hs.reduce((a, h) => a + (h.disponible ? h.cupos : 0), 0)} · ⏱ ${durTxt}`;
}

// ═══════════════════════════════════════════
//  ¡PROCESAR RESERVA CONECTADO A NEON!
// ═══════════════════════════════════════════
async function procesarReserva() {
  const btn = document.getElementById('btnReservar');
  const msg = document.getElementById('msgReserva');
  
  const n = document.getElementById('rNombre').value.trim();
  const e = document.getElementById('rEmail').value.trim();
  const t = document.getElementById('rTel').value.trim();
  const f = document.getElementById('rFecha').value;
  const to = document.getElementById('rTour').value;

  if (!n || !e || !f) {
    if (msg) {
      msg.innerHTML = `<span style="color:#c0392b;">⚠️ ${lang==='es'?'Complete todos los campos necesarios':'Please fill all required fields'}</span>`;
    }
    return;
  }

  if (CFG.soloFinDeSemana) {
    const d = new Date(f + 'T00:00:00').getDay();
    if (d !== 0 && d !== 6) {
      msg.innerHTML = `<span style="color:#c0392b;">⚠️ ${lang==='es'?'Solo están disponibles sábados y domingos.':'Only Saturdays and Sundays are available.'}</span>`;
      return;
    }
  }

  // Deshabilitar botón para evitar doble envío
  btn.disabled = true;
  btn.innerText = lang === 'es' ? "⏳ Enviando..." : "⏳ Sending...";
  msg.innerHTML = `<span style="color:#f39c12;">⏳ ${lang==='es'?'Enviando reserva a la base de datos...':'Sending booking to database...'}</span>`;

  try {
    const respuesta = await fetch('/api/reservar', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        nombre: n,
        email: e,
        telefono: t || '',
        fecha: f,
        tour: to || '',
        horario: 'Pendiente'
      })
    });

    const datos = await respuesta.json();

    if (datos.success) {
      // Guardar también en localStorage para respaldo local
      if (!DB.reservas) DB.reservas = [];
      DB.reservas.push({
        nombre: n,
        email: e,
        telefono: t || '',
        fecha: f,
        tour: to || '',
        horario: 'Pendiente',
        fechaReserva: new Date().toISOString()
      });
      guardar();

      msg.innerHTML = `<span style="color:#27ae60;">✅ ${n}, ${lang==='es'?'¡Reserva confirmada! El equipo le confirmará el horario.':'Booking confirmed! The team will confirm your schedule.'}</span>`;
      
      // Limpiar formulario
      ['rNombre', 'rEmail', 'rTel', 'rFecha'].forEach(id => document.getElementById(id).value = '');
      
      // Actualizar vista admin si está abierta
      if (document.getElementById('moAdminPanel').classList.contains('open')) {
        await sincronizarReservasDesdeLaNube();
      }
      
      actualizarHorarios();
    } else {
      msg.innerHTML = `<span style="color:#c0392b;">❌ ${datos.error || 'Error al guardar la reserva'}</span>`;
    }
  } catch (error) {
    console.error('Error en reserva:', error);
    msg.innerHTML = `<span style="color:#c0392b;">❌ ${lang==='es'?'Error de conexión con el servidor':'Server connection error'}</span>`;
  }

  btn.disabled = false;
  btn.innerText = lang === 'es' ? "✅ Confirmar Reserva" : "✅ Confirm Booking";
}

// ═══════════════════════════════════════════
//  SINCRONIZAR RESERVAS DESDE NEON
// ═══════════════════════════════════════════
async function sincronizarReservasDesdeLaNube() {
  try {
    const respuesta = await fetch('/api/reservar');
    if (!respuesta.ok) {
      throw new Error('No se pudieron traer las reservas del servidor.');
    }
    const datosBD = await respuesta.json();
    if (Array.isArray(datosBD)) {
      DB.reservas = datosBD.map(res => ({
        nombre: res.nombre_visitante || res.nombre || '',
        email: res.email || '',
        telefono: res.telefono || '',
        fecha: res.fecha_reserva || res.fecha || '',
        tour: res.tour || '',
        horario: res.horario || '',
        fechaReserva: res.fecha_creacion || res.fecha_reserva || new Date().toISOString()
      }));
      guardar();
      if (typeof renderReservasAdmin === 'function') {
        renderReservasAdmin();
      }
      if (typeof actualizarHorarios === 'function') {
        actualizarHorarios();
      }
      console.log(`✅ ${DB.reservas.length} reservas sincronizadas desde Neon`);
    }
  } catch (error) {
    console.error('Error al sincronizar reservas:', error);
  }
}

// ─── RESERVAS ADMIN ───
function generarHorariosAdmin(fecha) {
    const ahora = new Date();
    const esHoy = new Date(fecha + "T00:00:00").toDateString() === ahora.toDateString();
    let hor = 8, min = 0, lista = [];
    while (hor < 16) {
        const hs = `${String(hor).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
        let disp = true;
        if (esHoy) {
            if (hor < ahora.getHours() || (hor === ahora.getHours() && min <= ahora.getMinutes())) disp = false;
        }
        const ocup = DB.reservas.filter(rv => rv.fecha === fecha && rv.horario === hs).length;
        if (ocup >= CFG.capacidadHorario) disp = false;
        lista.push({ hora: hs, disponible: disp, cupos: CFG.capacidadHorario - ocup });
        min += 30;
        if (min >= 60) { hor += Math.floor(min / 60); min = min % 60; }
    }
    return lista;
}

function poblarSelHorarioAdmin(){
  const rSel = document.getElementById('selReservaAdmin');
  const hSel = document.getElementById('selHorarioAdmin');
  const fSel = document.getElementById('selFechaAdmin');
  const avisoFds = document.getElementById('aviso-fds-admin');
  if(avisoFds) avisoFds.style.display = CFG.soloFinDeSemana ? 'block' : 'none';
  if(!hSel || !rSel) return;
  const idx = parseInt(rSel.value);
  if (isNaN(idx) || !DB.reservas[idx]) {
    hSel.innerHTML = '<option>— Selecciona una reserva primero —</option>';
    return;
  }
  const r = DB.reservas[idx];
  if(fSel && !fSel.value){ fSel.value = r.fecha || ''; fSel.min = new Date().toISOString().split('T')[0]; }
  const fechaUsar = (fSel && fSel.value) ? fSel.value : r.fecha;
  if(CFG.soloFinDeSemana && fechaUsar){
    const dw = new Date(fechaUsar + 'T00:00:00').getDay();
    if(dw !== 0 && dw !== 6){
      if(avisoFds){ avisoFds.style.display = 'block'; avisoFds.innerHTML = '⚠️ <strong>Atención:</strong> La fecha seleccionada (<strong>' + fechaUsar + '</strong>) no es sábado ni domingo, pero la finca está configurada solo para fines de semana.'; avisoFds.style.background = '#f8d7da'; avisoFds.style.borderLeftColor = '#c0392b'; avisoFds.style.color = '#721c24'; }
    } else {
      if(avisoFds){ avisoFds.innerHTML = '📅 <strong>Solo fines de semana:</strong> El calendario está configurado para aceptar únicamente sábados y domingos.'; avisoFds.style.background = '#fff3cd'; avisoFds.style.borderLeftColor = '#f39c12'; avisoFds.style.color = '#856404'; }
    }
  }
  let hs = generarHorariosAdmin(fechaUsar);
  if(hs.length === 0 && CFG.horariosDisponibles && CFG.horariosDisponibles.length){
    hs = CFG.horariosDisponibles.map(hora => ({ hora, disponible: true, cupos: CFG.capacidadHorario || 15 }));
  }
  if(hs.length === 0){
    const horasDefault = ['8:00','9:00','10:00','11:00','13:00','14:00','15:00'];
    hs = horasDefault.map(h => ({ hora: h, disponible: true, cupos: CFG.capacidadHorario || 15 }));
  }

function abrirMiCuenta(){

function guardarCuenta(){
  if(!clienteActual) return;
  const nombre  = document.getElementById('cuentaNombre').value.trim();
  const tel     = document.getElementById('cuentaTel').value.trim();
  const pNueva  = document.getElementById('cuentaPassNueva').value;
  const pConf   = document.getElementById('cuentaPassConf').value;
  const msg     = document.getElementById('cuentaMsg');
  if(!nombre){ mostrarMsgCuenta(lang==='es'?'⚠️ El nombre no puede estar vacío.':'⚠️ Name cannot be empty.','#fff3cd','#856404'); return; }
  if(pNueva && pNueva !== pConf){ mostrarMsgCuenta(lang==='es'?'⚠️ Las contraseñas no coinciden.':'⚠️ Passwords do not match.','#f8d7da','#721c24'); return; }
  DB.clientes[clienteActual.email].nombre = nombre;
  DB.clientes[clienteActual.email].telefono = tel;
  if(pNueva) DB.clientes[clienteActual.email].password = btoa(pNueva);
  clienteActual = {...DB.clientes[clienteActual.email], email: clienteActual.email};
  guardar();
  actualizarVistaMiPlanta();
  mostrarMsgCuenta(lang==='es'?'✅ Datos actualizados exitosamente.':'✅ Account updated successfully.','#d4edda','#155724');
}

  msg.style.background = bg;

}

  const hoy = new Date();
  const fecha = hoy.toISOString().split('T')[0];
  const cl = Object.entries(DB.clientes).map(([e,c])=>({ Nombre: c.nombre, Email: e, Teléfono: c.telefono||'', Planta: c.codigoPlanta||'Sin asignar', Visitó: c.visita?'Sí':'No', 'Fecha Visita': c.fechaVisita ? new Date(c.fechaVisita).toLocaleDateString() : '-', 'Fecha Registro': new Date(c.fechaRegistro).toLocaleDateString() }));
  if(cl.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cl), 'Clientes');
  const pl = Object.entries(DB.plantas).filter(([c,p])=>p.clienteEmail).map(([c,p])=>({ Código: c, Cliente: DB.clientes[p.clienteEmail]?.nombre||'', Email: p.clienteEmail, Comentario: p.comentario||'-', 'Tiene Imagen': p.imagen?'Sí':'No' }));
  if(pl.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pl), 'Plantas');
  const rv = DB.reservas.map(r=>({ Nombre: r.nombre, Email: r.email, Teléfono: r.telefono, Fecha: r.fecha, Tour: r.tour, Horario: r.horario }));
  if(rv.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rv), 'Reservas');
  const pa = DB.padrinos.map(p=>({ Fecha: new Date(p.fecha).toLocaleDateString(), Nombre: p.nombre, Email: p.email, Teléfono: p.telefono, Aporte: p.tipoAporte, Mensaje: p.mensaje||'-' }));
  if(pa.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pa), 'Padrinos');
  const inact = Object.entries(DB.clientes).filter(([e,c])=> c.codigoPlanta && (!c.visita || (c.fechaVisita && (hoy-new Date(c.fechaVisita)) > 30*24*60*60*1000))).map(([e,c])=>({ Nombre: c.nombre, Email: e, Planta: c.codigoPlanta, 'Última Visita': c.fechaVisita ? new Date(c.fechaVisita).toLocaleDateString() : 'Nunca', 'Días sin visita': Math.floor((hoy - new Date(c.fechaVisita||c.fechaRegistro)) / 86400000) }));
  if(inact.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(inact), 'Inactivos');
  const ca = DB.cancelaciones.map(c=>({ Nombre: c.nombre, Email: c.email, 'Fecha Original': c.fecha, 'Fecha Cancelación': new Date(c.fechaCancelacion).toLocaleString() }));
  if(ca.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ca), 'Cancelaciones');
  const cap = capInfo();
  const capData = [{ 'Total Plantas': cap.total, 'Plantas Ocupadas': cap.ocupadas, 'Plantas Disponibles': cap.disponibles, 'Porcentaje Ocupación': `${((cap.ocupadas/cap.total)*100).toFixed(1)}%` }];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(capData), 'Capacidad');
  const vDia = {};
  Object.values(DB.clientes).forEach(c=>{ if(c.visita&&c.fechaVisita){ const f=new Date(c.fechaVisita).toLocaleDateString(); vDia[f]=(vDia[f]||0)+1; }});
  const visitas = Object.entries(vDia).sort().map(([f,n])=>({'Fecha':f,'Visitas':n}));
  if(visitas.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(visitas), 'Visitas');
  if(wb.SheetNames.length===0){ return; }
  const historias = JSON.parse(localStorage.getItem('fec_testimonios') || '[]').map(t => ({ Autor: t.autor, Historia: t.texto, Fecha: new Date(t.fecha).toLocaleDateString('es-CR'), Anonimo: t.anon ? 'Sí' : 'No' }));
  if(historias.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(historias), 'Historias');
  XLSX.writeFile(wb, `finca_el_curio_${fecha}.xlsx`);
}

// ═══════════════════════════════════════════
//  INICIALIZAR
// ═══════════════════════════════════════════
function scrollToReserva(){
  document.getElementById('reservas').scrollIntoView({ behavior: 'smooth' });
}

function init(){
  cargar();
  aplicarImagenes();
  aplicarVisibilidad();
  aplicarConfig();
  renderCap();
  renderTours();
  actualizarHorarios();
  const hoyISO = new Date().toISOString().split('T')[0];
  const rFechaEl = document.getElementById('rFecha');
  if(rFechaEl) rFechaEl.min = hoyISO;
  const selFechaAdminEl = document.getElementById('selFechaAdmin');
  if(selFechaAdminEl) selFechaAdminEl.min = hoyISO;

  // Eventos de botones usando addEventListener para mayor robustez
  document.getElementById('btnReg').addEventListener('click', ()=>abrirModal('moReg'));
  document.getElementById('btnLogin').addEventListener('click', ()=>abrirModal('moLogin'));
  document.getElementById('btnLogoutCliente').addEventListener('click', logoutCliente);
  document.getElementById('btnDoReg').addEventListener('click', registrarCliente);
  document.getElementById('btnDoLogin').addEventListener('click', loginCliente);
  document.getElementById('btnAbrirRecup').addEventListener('click', ()=>{cerrarModal('moLogin'); abrirModal('moRecup');});
  document.getElementById('btnDoRecup').addEventListener('click', enviarRecuperacion);
  document.getElementById('btnDoReset').addEventListener('click', guardarNuevaPass);
  document.getElementById('btnGuardarTel').addEventListener('click', guardarTelCliente);
  document.getElementById('btnMiCuenta').addEventListener('click', (e)=>{e.preventDefault(); abrirMiCuenta();});
  document.getElementById('btnGuardarCuenta').addEventListener('click', guardarCuenta);
  document.querySelectorAll('.opcion-aporte').forEach(el=>el.addEventListener('click', ()=>toggleAporte(el)));
  document.getElementById('btnAceptarPadrino').addEventListener('click', registrarPadrino);
  document.getElementById('rFecha').addEventListener('change', actualizarHorarios);
  // El botón de reserva ahora usa procesarReserva (conectado a Neon)
  document.getElementById('btnReservar').addEventListener('click', procesarReserva);
  document.getElementById('btnDoEmail').addEventListener('click', enviarEmail);
  document.getElementById('btnSubirImgCliente').addEventListener('click', subirImgCliente);
  document.getElementById('btnGuardarComentario').addEventListener('click', guardarComentario);
  document.getElementById('btnDoAdminLogin').addEventListener('click', loginAdmin);
  document.getElementById('btnAdminLogout').addEventListener('click', logoutAdmin);
  document.getElementById('btnGuardarPlanta').addEventListener('click', guardarPlantaAdmin);
  document.getElementById('btnExcel').addEventListener('click', exportarExcel);
  document.getElementById('btnSaveConfig').addEventListener('click', guardarConfig);
  document.getElementById('btnSaveBancos').addEventListener('click', guardarBancos);
  document.getElementById('btnSaveMetodosPago').addEventListener('click', guardarMetodosPago);
  document.getElementById('btnSaveTours').addEventListener('click', guardarTours);
  // Capacidad: el botón tiene onclick en el HTML, pero también podemos asignar evento
  const capBtn = document.querySelector('[onclick="guardarCapacidadPlantas()"]');
  if(capBtn) capBtn.addEventListener('click', guardarCapacidadPlantas);

  document.querySelectorAll('.admin-nav-btn').forEach(b=>b.addEventListener('click', ()=>mostrarSecAdmin(b.getAttribute('data-sec'))));
  document.querySelectorAll('.filtro-btn').forEach(b=>b.addEventListener('click', ()=>{
    document.querySelectorAll('.filtro-btn').forEach(x=>x.classList.remove('activo'));
    b.classList.add('activo'); filtroClientes=b.getAttribute('data-fil'); renderClientes();
  }));
  document.addEventListener('change', e=>{
    if(e.target.id==='selReservaAdmin'){
      const fSel = document.getElementById('selFechaAdmin');
      if(fSel) fSel.value = '';
      poblarSelHorarioAdmin();
    }
    if(e.target.id==='selFechaAdmin') poblarSelHorarioAdmin();
  });

  const savedLang = localStorage.getItem('fec_lang') || 'es';
  if(savedLang !== 'es') setLang(savedLang);
  renderTestimonios();
  const btnT = document.getElementById('btnAbrirTestimonio');
  if(btnT) btnT.style.display = 'inline-flex';
  const secs=document.querySelectorAll('section[id],div[id]');
  const navAs=document.querySelectorAll('nav a');
  window.addEventListener('scroll', ()=>{
    let cur='';
    secs.forEach(s=>{if(window.scrollY>=s.offsetTop-120) cur=s.id;});
    navAs.forEach(a=>{a.style.color=a.getAttribute('href')==='#'+cur?'var(--vc)':'';});
  });
  renderImageUploader();
  
  // Sincronizar reservas desde Neon al cargar
  setTimeout(async () => {
    await sincronizarReservasDesdeLaNube();
  }, 1000);
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
